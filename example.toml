[audit]
audit_file = "/tmp/claude-tool-use.json"
# Audit level: off, matched (default), all
# - off: no auditing
# - matched: audit only tool use that hits a rule (allow/deny)
# - all: audit everything including passthrough
audit_level = "matched"
# Dedicated log for commands that matched neither allow nor deny rules.
# Review this file to identify rule gaps and tighten your config.
passthrough_log_file = "/tmp/claude-passthrough.json"

[limits]
# Deny Bash commands with more than this many chained sub-commands.
# Complex chains should be broken into separate tool calls.
# Set to 0 to disable (default).
max_chain_length = 5

# --- Reusable variables (referenced as ${VAR_NAME} in regex fields) ---
# Standard env vars like $HOME expand automatically in values.

[variables]
# Safe command groups (merged via inter-variable expansion)
# File and text processing
FILE_CMDS = "awk|cat|comm|cut|diff|expand|file|fmt|fold|grep|head|nl|od|paste|rg|sed|seq|shuf|sort|tac|tail|tee|tr|unexpand|uniq|wc|xargs"
# Filesystem navigation and management
FS_CMDS = "basename|cd|chmod|cp|dirname|du|df|find|ls|lsof|mkdir|mktemp|readlink|realpath|stat|touch|tree"
# Process and system info
SYS_CMDS = "date|echo|env|export|expr|false|id|nproc|numfmt|printenv|printf|pwd|sleep|source|test|timeout|true|tty|uname|which|whoami"
# Merged safe commands (variable references expand automatically)
SAFE_CMDS = "${FILE_CMDS}|${FS_CMDS}|${SYS_CMDS}"
# Block command substitution (backtick and $(...))
NO_CMD_SUB = "`|\\$\\("
# Allowed project path - customize to your workspace
PROJECT_PATH = "^$HOME/projects/"
# Path traversal exclusion
NO_TRAVERSAL = "\\.\\."

# --- DENY rules (checked first, take precedence over allow) ---

# Deny rm - uses \b word boundary to catch rm anywhere in a command,
# including inside compound commands like "echo ok && rm file".
[[deny]]
tool = "Bash"
command_regex = "\\brm\\b"

# Deny sensitive file reads
[[deny]]
tool = "Read"
file_path_regex = "\\.(env|secret)$"

# Deny git commit - uses \b word boundaries to catch git with any
# flags between git and commit (e.g. "git --no-pager commit",
# "git -C /tmp commit").
[[deny]]
tool = "Bash"
command_regex = ".*\\bgit\\b.*\\bcommit\\b"

# Deny git stash
[[deny]]
tool = "Bash"
command_regex = ".*\\bgit\\b.*\\bstash\\b"

# Deny git clean (destructive)
[[deny]]
tool = "Bash"
command_regex = ".*\\bgit\\b.*\\bclean\\b"

# Deny for loops (force .py/.sh files for looping logic)
[[deny]]
tool = "Bash"
command_regex = "^for\\b"
reason = "Do not use for loops in Bash tool. Write the logic in a _temp.py or _temp.sh file instead (underscore-prefixed files can be removed freely)."

# Deny while loops (force .py/.sh files for looping logic)
[[deny]]
tool = "Bash"
command_regex = "^while\\b"
reason = "Do not use while loops in Bash tool. Write the logic in a _temp.py or _temp.sh file instead (underscore-prefixed files can be removed freely)."

# Deny git rm
[[deny]]
tool = "Bash"
command_regex = ".*\\bgit\\b.*\\brm\\b"

# Deny bare mv (use git mv for tracked files)
[[deny]]
tool = "Bash"
command_regex = "^mv\\b"
reason = "Use 'git mv' for tracked files. If the file is untracked, use cp + rm or ask the user."

# Example: deny with custom reason (shown to Claude when rule fires)
# [[deny]]
# tool = "Bash"
# command_regex = "\\$PYTHON\\b"
# reason = "Use 'python3' directly instead of $PYTHON variable"

# --- ALLOW rules ---
# The shell command decomposer (brush-parser) splits compound commands
# (&&, ||, ;, pipes, loops) and unwraps bash -c "..." patterns into
# leaf sub-commands.  Each leaf is checked independently against these
# rules, so simple per-command rules are sufficient.

# Allow rm on underscore-prefixed files (temporary/scratch files)
[[allow]]
tool = "Bash"
command_regex = "\\brm\\s+(-[a-zA-Z]+\\s+)*_\\S+"
command_exclude_regex = "${NO_CMD_SUB}"

# -------------------------------------------------------------------
# Bash: python tooling
# -------------------------------------------------------------------

[[allow]]
tool = "Bash"
command_regex = "^(python3?|PYTHONPATH=)\\s?"
command_exclude_regex = "${NO_CMD_SUB}"

[[allow]]
tool = "Bash"
command_regex = "^(pytest|pyflakes)\\s"
command_exclude_regex = "${NO_CMD_SUB}"

# -------------------------------------------------------------------
# Bash: local runtimes (node, deno, npx whitelist)
# -------------------------------------------------------------------

# node running local JS files (.js, .mjs, .cjs)
[[allow]]
tool = "Bash"
command_regex = "^node\\s+(-[a-zA-Z]+\\s+)*[A-Za-z0-9_./-]+\\.(js|mjs|cjs)\\b"
command_exclude_regex = "${NO_CMD_SUB}"

# node -c / --check for syntax checking (read-only, no injection vector)
[[allow]]
tool = "Bash"
command_regex = "^node\\s+(-c|--check)\\s"

# node -e / --eval for quick inline evaluation
[[allow]]
tool = "Bash"
command_regex = "^node\\s+(-e|--eval)\\s"
command_exclude_regex = "${NO_CMD_SUB}"

# node --version (info only, no arguments)
[[allow]]
tool = "Bash"
command_regex = "^node\\s+--version"

# npx with known-safe local dev tool packages only.
# Unknown packages still passthrough to user prompt.
[[allow]]
tool = "Bash"
command_regex = "^npx\\s+(tsc|eslint|prettier)(\\s|$)"
command_exclude_regex = "${NO_CMD_SUB}"

# eslint -- local code linter (read-only analysis)
[[allow]]
tool = "Bash"
command_regex = "^eslint\\b"
command_exclude_regex = "${NO_CMD_SUB}"

# prettier -- code formatter
[[allow]]
tool = "Bash"
command_regex = "^prettier\\b"
command_exclude_regex = "${NO_CMD_SUB}"

# deno subcommands for local development (not remote URLs)
[[allow]]
tool = "Bash"
command_regex = "^deno\\s+(run|check|fmt|lint|test)\\b"
command_exclude_regex = "https?://|${NO_CMD_SUB}"

# deno --version (info only, no arguments)
[[allow]]
tool = "Bash"
command_regex = "^deno\\s+--version"

# -------------------------------------------------------------------
# Bash: cargo commands (exclude destructive subcommands)
# -------------------------------------------------------------------

[[allow]]
tool = "Bash"
command_regex = "^cargo\\b"
command_exclude_regex = "\\b(publish|yank|login|logout|owner|install)\\b|${NO_CMD_SUB}"

# -------------------------------------------------------------------
# Bash: git allowlist (read-only + staging)
# -------------------------------------------------------------------

[[allow]]
tool = "Bash"
command_regex = "^git\\s+(-C\\s+\\S+\\s+)?(add|branch|checkout|diff|log|ls-files|ls-tree|mv|pull|remote|restore|rev-parse|show|status|worktree)(\\s|$)"
command_exclude_regex = "${NO_CMD_SUB}"

# -------------------------------------------------------------------
# Bash: run a shell script directly (with optional -n syntax check)
# -------------------------------------------------------------------

[[allow]]
tool = "Bash"
command_regex = "^bash\\s+(-n\\s+)?[A-Za-z0-9_./-]+\\.sh\\b"
command_exclude_regex = "${NO_CMD_SUB}"

# -------------------------------------------------------------------
# Bash: execute a shell script via relative path (./script.sh)
# -------------------------------------------------------------------

[[allow]]
tool = "Bash"
command_regex = "^\\./[A-Za-z0-9_.-]+\\.sh\\b"
command_exclude_regex = "${NO_CMD_SUB}"

# -------------------------------------------------------------------
# Bash: common shell utilities
# -------------------------------------------------------------------

[[allow]]
tool = "Bash"
command_regex = "^(${SAFE_CMDS})\\b"
command_exclude_regex = "${NO_CMD_SUB}"

# -------------------------------------------------------------------
# Bash: env-var-prefixed commands (e.g. LC_ALL=C grep ...,
# REPO_ROOT=x PYTHONPATH=y python3 -m pytest ...)
# Supports one or more VAR=value prefixes before the command.
# -------------------------------------------------------------------

[[allow]]
tool = "Bash"
command_regex = "^([A-Z_]+=[^ ]+\\s+)+(${SAFE_CMDS}|python3?|pytest|pyflakes)\\b"
command_exclude_regex = "${NO_CMD_SUB}"

# -------------------------------------------------------------------
# Bash: package managers (read-only queries)
# -------------------------------------------------------------------

[[allow]]
tool = "Bash"
command_regex = "^pip3?\\s+(show|list|freeze|check)\\b"
command_exclude_regex = "${NO_CMD_SUB}"

[[allow]]
tool = "Bash"
command_regex = "^brew\\s+(list|info|search|--prefix)\\b"
command_exclude_regex = "${NO_CMD_SUB}"

[[allow]]
tool = "Bash"
command_regex = "^npm\\s+(list|root|ls|show|view|info|search|outdated|doctor|prefix|version|--version)\\b"
command_exclude_regex = "${NO_CMD_SUB}"

# npm run -- executes scripts defined in local package.json
[[allow]]
tool = "Bash"
command_regex = "^npm\\s+run\\b"
command_exclude_regex = "${NO_CMD_SUB}"

# -------------------------------------------------------------------
# Glob/Grep: search tools
# -------------------------------------------------------------------

[[allow]]
tool = "Glob"
file_path_regex = "${PROJECT_PATH}"
file_path_exclude_regex = "${NO_TRAVERSAL}"

[[allow]]
tool = "Grep"
file_path_regex = "${PROJECT_PATH}"
file_path_exclude_regex = "${NO_TRAVERSAL}"

# -------------------------------------------------------------------
# Read/Write/Edit: filesystem access
# -------------------------------------------------------------------

[[allow]]
tool = "Read"
file_path_regex = "${PROJECT_PATH}"
file_path_exclude_regex = "${NO_TRAVERSAL}"

[[allow]]
tool = "Write"
file_path_regex = "${PROJECT_PATH}"
file_path_exclude_regex = "${NO_TRAVERSAL}"

[[allow]]
tool = "Edit"
file_path_regex = "${PROJECT_PATH}"
file_path_exclude_regex = "${NO_TRAVERSAL}"

# /tmp access for scratch files (macOS resolves /tmp to /private/tmp)
[[allow]]
tool = "Read"
file_path_regex = "^(/private)?/tmp/"

[[allow]]
tool = "Write"
file_path_regex = "^(/private)?/tmp/"

[[allow]]
tool = "Edit"
file_path_regex = "^(/private)?/tmp/"

# macOS per-user temp dirs (/var/folders/XX/YY/T/) - screenshots, temp files, etc.
# Scoped to the T/ temp subdirectory only, not caches (C/) or other dirs.
[[allow]]
tool = "Read"
file_path_regex = "^/var/folders/[^/]+/[^/]+/T/"

[[allow]]
tool = "Write"
file_path_regex = "^/var/folders/[^/]+/[^/]+/T/"

[[allow]]
tool = "Edit"
file_path_regex = "^/var/folders/[^/]+/[^/]+/T/"

# -------------------------------------------------------------------
# Web tools
# -------------------------------------------------------------------

[[allow]]
tool = "WebFetch"

[[allow]]
tool = "WebSearch"

# -------------------------------------------------------------------
# Task/subagent tools
# -------------------------------------------------------------------

[[allow]]
tool = "Agent"
subagent_type_regex = "^(Explore|general-purpose|Plan|Bash|haiku|sonnet|opus|statusline-setup|claude-code-guide|superpowers:code-reviewer)$"

# -------------------------------------------------------------------
# Claude internal tools (orchestration/UI, no side effects)
# -------------------------------------------------------------------

[[allow]]
tool_regex = "^(TaskOutput|TaskCreate|TaskList|TaskGet|TaskUpdate|TaskStop|Skill|SendMessage|TeamCreate|TeamDelete|NotebookEdit)$"

# -------------------------------------------------------------------
# MUST PASSTHROUGH - tools with interactive UI dialogs
# Auto-approving these bypasses Claude Code's user-facing dialogs,
# causing blank answers or skipped consent screens.
# Do NOT add these to any allow rule:
#   - AskUserQuestion  (interactive question dialog; blank if auto-allowed)
#   - EnterPlanMode    (user must consent to entering plan mode)
#   - ExitPlanMode     (user must review and approve the plan)
#   - EnterWorktree    (user must consent to worktree creation)
#   - ExitWorktree     (user must consent to keep/remove worktree)
#   - CronCreate       (user should approve scheduled recurring jobs)
#   - CronDelete       (user should approve canceling scheduled jobs)
#   - CronList         (read-only but kept consistent with Cron tools)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Playwright MCP browser tools (sandboxed browser interaction)
# -------------------------------------------------------------------

[[allow]]
tool_regex = "^mcp__plugin_playwright_playwright__browser_"
